name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run smoke:install
        env:
          MUSTACHE_SMOKE_FULL_TESTS: '1'
      - name: Check minimum supported Prettier version
        run: npm run smoke:install
        env:
          MUSTACHE_SMOKE_PRETTIER_VERSION: 3.0.0
          MUSTACHE_SMOKE_FULL_TESTS: '1'
      - name: Check representative Prettier 3 releases
        if: matrix.node-version == 18
        run: |
          for version in 3.3.3 3.6.2; do
            MUSTACHE_SMOKE_PRETTIER_VERSION="$version" npm run smoke:install
          done
        env:
          MUSTACHE_SMOKE_FULL_TESTS: '1'
